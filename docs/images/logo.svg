<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="logoAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="logoGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="60" cy="60" r="55" fill="url(#logoBg)"/>

  <!-- Graduation cap -->
  <g transform="translate(30, 28)" filter="url(#logoGlow)">
    <polygon points="30,0 60,14 30,28 0,14" fill="white" opacity="0.95"/>
    <rect x="27" y="14" width="6" height="24" fill="white" opacity="0.8"/>
    <rect x="24" y="35" width="12" height="3" rx="1.5" fill="white" opacity="0.6"/>
    <!-- Tassel -->
    <circle cx="60" cy="14" r="2.5" fill="#f59e0b"/>
    <line x1="60" y1="14" x2="60" y2="26" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="58.5" y="24" width="3" height="5" rx="1" fill="#f59e0b"/>
  </g>

  <!-- TA text -->
  <text x="60" y="85" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="white" letter-spacing="1">
    TA RS
  </text>
  <text x="60" y="98" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" fill="rgba(255,255,255,0.6)" letter-spacing="0.5">
    GROUP 68
  </text>
</svg>