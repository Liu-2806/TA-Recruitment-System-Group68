  <rect x="40" y="628" width="1020" height="56" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow1)"/>
  <rect x="40" y="628" width="1020" height="4" rx="2" fill="#64748b"/>
  <text x="70" y="654" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#475569">Data Persistence (File-based, No Database)</text>

  <rect x="350" y="644" width="100" height="26" rx="5" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="400" y="661" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#475569">users/*.json</text>

  <rect x="460" y="644" width="100" height="26" rx="5" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="510" y="661" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#475569">postings/*.json</text>

  <rect x="570" y="644" width="110" height="26" rx="5" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="625" y="661" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#475569">applications/*.json</text>

  <rect x="690" y="644" width="110" height="26" rx="5" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="745" y="661" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#475569">notifications/*.json</text>

  <rect x="810" y="644" width="100" height="26" rx="5" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="860" y="661" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#475569">system/*.json</text>

  <rect x="920" y="644" width="100" height="26" rx="5" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="970" y="661" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#475569">resumes/*.pdf</text>
</svg>