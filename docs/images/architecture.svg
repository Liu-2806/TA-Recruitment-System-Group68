  <rect x="40" y="500" width="520" height="4" rx="2" fill="url(#g4)"/>
  <text x="70" y="526" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#d97706">Repository Layer</text>
  <text x="70" y="543" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b">JSON File-based DAL · Gson Serialization · synchronized I/O</text>

  <rect x="70" y="552" width="120" height="34" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="130" y="573" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#92400e">TADataRepo</text>

  <rect x="200" y="552" width="120" height="34" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="260" y="573" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#92400e">PostingRepo</text>

  <rect x="330" y="552" width="120" height="34" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="390" y="573" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#92400e">ApplicationRepo</text>

  <rect x="460" y="552" width="80" height="34" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="500" y="573" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#92400e">System</text>

  <!-- Specialized Modules -->
  <rect x="590" y="500" width="470" height="100" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow1)"/>
  <rect x="590" y="500" width="470" height="4" rx="2" fill="url(#g5)"/>
  <text x="620" y="526" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#7c3aed">Specialized Modules</text>

  <!-- Resume module -->
  <rect x="620" y="540" width="200" height="48" rx="8" fill="#faf5ff" stroke="#c084fc" stroke-width="1"/>
  <text x="720" y="558" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#6d28d9">📄 Resume Pipeline</text>
  <text x="720" y="575" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#7c3aed">PDFBox Extract → Heuristic Structure</text>

  <!-- Match module -->
  <rect x="840" y="540" width="200" height="48" rx="8" fill="#faf5ff" stroke="#c084fc" stroke-width="1"/>
  <text x="940" y="558" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#6d28d9">🤖 AI Match Engine</text>
  <text x="940" y="575" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#7c3aed">LLM + Local Rule · Dual-Engine</text>

  <!-- Arrow down -->
  <line x1="300" y1="600" x2="300" y2="628" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>

