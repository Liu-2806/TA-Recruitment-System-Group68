  <rect x="260" y="435" width="150" height="26" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="335" y="452" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#047857">ResumeService</text>

  <rect x="420" y="435" width="200" height="26" rx="5" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1"/>
  <text x="520" y="452" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#6d28d9">RecommendationService ⚡</text>

