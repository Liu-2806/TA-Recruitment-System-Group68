  <text x="70" y="393" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b">Interface + Impl · DI via ServiceRegistry · Constructor Injection</text>

  <!-- Service boxes row 1 -->
  <rect x="70" y="402" width="130" height="26" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="135" y="419" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#047857">AuthService</text>

  <rect x="210" y="402" width="130" height="26" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="275" y="419" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#047857">ProfileService</text>

  <rect x="350" y="402" width="130" height="26" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="415" y="419" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#047857">JobService</text>

  <rect x="490" y="402" width="130" height="26" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="555" y="419" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#047857">UserService</text>

