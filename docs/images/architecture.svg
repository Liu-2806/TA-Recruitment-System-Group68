<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/><stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow1">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#3b82f6"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="700" rx="16" fill="#f8fafc"/>

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0f172a">
    System Architecture — Three-Tier Layered Design
  </text>

  <!-- Layer 1: Presentation -->
  <rect x="40" y="60" width="1020" height="130" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow1)"/>
  <rect x="40" y="60" width="1020" height="4" rx="2" fill="url(#g1)"/>
  <text x="70" y="86" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#2563eb">Presentation Layer</text>
  <text x="70" y="103" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b">JSP + JSTL + CSS3 + JavaScript</text>

  <!-- Role boxes -->
  <rect x="70" y="115" width="180" height="58" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="160" y="138" text-anchor="middle" font-size="12">🎓</text>
  <text x="160" y="156" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#1e40af">TA Views (12 JSP)</text>

  <rect x="280" y="115" width="180" height="58" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="370" y="138" text-anchor="middle" font-size="12">📋</text>
  <text x="370" y="156" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#1e40af">MO Views (10 JSP)</text>

  <rect x="490" y="115" width="180" height="58" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="580" y="138" text-anchor="middle" font-size="12">⚙️</text>
  <text x="580" y="156" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#1e40af">Admin Views (7 JSP)</text>

  <rect x="700" y="115" width="180" height="58" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="790" y="138" text-anchor="middle" font-size="12">🔐</text>
  <text x="790" y="156" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#1e40af">Auth + Common (5 JSP)</text>

  <rect x="910" y="115" width="130" height="58" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="975" y="138" text-anchor="middle" font-size="12">🎨</text>
  <text x="975" y="156" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#059669">Shared Layout</text>

  <!-- Arrow down -->
  <line x1="550" y1="190" x2="550" y2="220" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>

