  <rect x="640" y="402" width="130" height="26" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="705" y="419" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#047857">AnalyticsService</text>

  <rect x="780" y="402" width="130" height="26" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="845" y="419" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#047857">NotificationSvc</text>

  <!-- ServiceRegistry box -->
  <rect x="780" y="435" width="260" height="26" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="910" y="452" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#475569">ServiceRegistry.java — DI Container</text>

  <!-- Arrows down (split) -->
  <line x1="350" y1="470" x2="350" y2="500" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="750" y1="470" x2="750" y2="500" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowPurple)"/>

