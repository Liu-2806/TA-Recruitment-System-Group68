  <rect x="40" y="220" width="1020" height="4" rx="2" fill="url(#g2)"/>
  <text x="70" y="246" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#06b6d4">Controller Layer</text>
  <text x="70" y="263" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b">Servlet 4.0 — @WebServlet Annotation-based Routing</text>

  <rect x="70" y="272" width="140" height="34" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="140" y="293" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#047857">auth/ (4)</text>

  <rect x="225" y="272" width="140" height="34" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="295" y="293" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#047857">ta/ (9)</text>

  <rect x="380" y="272" width="140" height="34" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="450" y="293" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#047857">mo/ (9)</text>

  <rect x="535" y="272" width="140" height="34" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="605" y="293" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#047857">admin/ (7)</text>

  <rect x="690" y="272" width="140" height="34" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="760" y="293" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#047857">common/ (6)</text>

  <rect x="845" y="272" width="200" height="34" rx="6" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="945" y="293" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#7c3aed">AuthFilter RBAC Pipeline</text>

  <!-- Arrow down -->
  <line x1="550" y1="320" x2="550" y2="350" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>

